name: CI

on:
  push:
    branches: ["main", "feature/**", "integration/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: python -m pytest -q tests

  openclaw-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npm run plugin:validate
      - name: Pack OpenClaw plugin candidate
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: acce-optimizer-openclaw-0.1.3
          path: ${{ runner.temp }}/openclaw-plugin-acce-optimizer-0.1.3.tgz
          if-no-files-found: error
