name: CI

on:
  push:
    branches: ["main", "feature/**", "integration/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: python -m pytest -q tests

  openclaw-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - name: Audit production dependency risk
        shell: bash
        run: |
          set -euo pipefail
          # npm audit exits nonzero when it finds vulnerabilities; capture the
          # report so we can distinguish runtime dependencies from dev tools.
          npm audit --omit=dev --json > "$RUNNER_TEMP/acce-production-audit.json" || true
          node --input-type=module - "$RUNNER_TEMP/acce-production-audit.json" <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (report.error || !report.metadata?.vulnerabilities) {
            throw new Error("Production dependency audit could not be completed");
          }
          const counts = report.metadata.vulnerabilities;
          console.log("Production dependency audit:", JSON.stringify(counts));
          if ((counts.high ?? 0) > 0 || (counts.critical ?? 0) > 0) {
            throw new Error("High or critical production dependency vulnerabilities require review");
          }
          NODE
      - run: npm test
      - run: npm run build
      - name: Isolated OpenClaw 2026.10.5 CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/acce-openclaw-home"
          mkdir -p "$HOME"
          cli_version="$(node_modules/.bin/openclaw --version)"
          case "$cli_version" in
            *2026.10.5*) ;;
            *) echo "Expected OpenClaw 2026.10.5, got: $cli_version" >&2; exit 1 ;;
          esac
          cat > "$RUNNER_TEMP/acce-openclaw-smoke-cli" <<'SH'
          #!/bin/sh
          exec "$GITHUB_WORKSPACE/node_modules/.bin/openclaw" --profile acce-ci-smoke "$@"
          SH
          chmod 700 "$RUNNER_TEMP/acce-openclaw-smoke-cli"
          ACCE_OPENCLAW_CLI_PATH="$RUNNER_TEMP/acce-openclaw-smoke-cli" node --input-type=module <<'NODE'
          import { readOpenClawRuntimeStatus } from "./dist/openclaw-cli-runtime-status.js";
          import { runtimeOverrideBlockReason } from "./dist/runtime-status-policy.js";
          const snapshot = await readOpenClawRuntimeStatus({
            cliPath: process.env.ACCE_OPENCLAW_CLI_PATH,
            timeoutMs: 15000,
          });
          if (!Number.isFinite(Date.parse(snapshot.modelsCapturedAt))) {
            throw new Error("OpenClaw CLI smoke test did not capture model catalog time");
          }
          if (!Array.isArray(snapshot.models) || snapshot.models.length === 0) {
            throw new Error("OpenClaw CLI smoke test did not return model rows");
          }
          if (!snapshot.models.every((model) =>
            typeof model.providerId === "string" &&
            typeof model.modelId === "string" &&
            (model.available === true || model.available === false || model.available === null)
          )) {
            throw new Error("OpenClaw CLI smoke test returned invalid availability values");
          }
          const availability = {
            available: snapshot.models.filter((model) => model.available === true).length,
            unavailable: snapshot.models.filter((model) => model.available === false).length,
            unknown: snapshot.models.filter((model) => model.available === null).length,
          };
          // Exercise the real OpenClaw CLI snapshot against ACCE's override
          // policy. An isolated profile without credentials must fail closed.
          if (availability.available !== 0) {
            throw new Error("Isolated OpenClaw profile unexpectedly reports an available model");
          }
          for (const model of snapshot.models) {
            const reason = runtimeOverrideBlockReason(snapshot, model.providerId, model.modelId, {
              now: Date.now(), maxAgeMs: 120_000,
            });
            if (reason !== "model-not-confirmed-available") {
              throw new Error(`Unconfigured model ${model.providerId}/${model.modelId} was not blocked: ${reason}`);
            }
          }
          console.log(JSON.stringify({
            cli: "OpenClaw 2026.10.5",
            profile: "acce-ci-smoke",
            modelRows: snapshot.models.length,
            availability,
            usageSnapshotPresent: Boolean(snapshot.usageCapturedAt),
          }));
          NODE
      - run: npm run plugin:validate
      - name: Pack OpenClaw plugin candidate
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Isolated OpenClaw plugin installation and discovery smoke
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/acce-install-smoke-home"
          mkdir -p "$HOME"
          package="$RUNNER_TEMP/openclaw-plugin-acce-optimizer-0.1.3.tgz"
          test -f "$package"
          # Only this disposable CI profile is permitted to bypass ClawHub
          # archive review. The tarball was built from this checked-out commit.
          # Never apply --force to an existing Aurora installation.
          node_modules/.bin/openclaw --profile acce-ci-install plugins install "$package" --force --accept-capabilities
          node_modules/.bin/openclaw --profile acce-ci-install plugins list --json > "$RUNNER_TEMP/acce-plugins.json"
          node --input-type=module - "$RUNNER_TEMP/acce-plugins.json" <<'NODE'
          import fs from "node:fs";
          const raw = fs.readFileSync(process.argv[2], "utf8");
          const parsed = JSON.parse(raw);
          const entries = Array.isArray(parsed) ? parsed :
            Array.isArray(parsed.plugins) ? parsed.plugins : [];
          const plugin = entries.find((entry) => entry.id === "acce-optimizer");
          if (!plugin) throw new Error("ACCE plugin absent from isolated OpenClaw plugin inventory");
          console.log(JSON.stringify({ id: plugin.id, status: plugin.status ?? null, enabled: plugin.enabled ?? null }));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: acce-optimizer-openclaw-0.1.3
          path: ${{ runner.temp }}/openclaw-plugin-acce-optimizer-0.1.3.tgz
          if-no-files-found: error
